function addDays(n) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + n);
  return d;
}
function startOfToday() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}
function formatMD(date) {
  if (!date) return "";
  return `${date.getMonth() + 1}月${date.getDate()}日`;
}
function toInputDate(date) {
  if (!date) return "";
  const y = date.getFullYear(), m = String(date.getMonth() + 1).padStart(2, "0"), d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
function fromInputDate(str) {
  if (!str) return null;
  const [y, m, d] = str.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function shiftDate(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}
function sameDate(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function dueInfo(date, status) {
  if (!date) return { text: "期限なし", tone: "later" };
  if (status === "done") return { text: `完了（${formatMD(date)}）`, tone: "done" };
  const diff = Math.round((date - startOfToday()) / 86400000);
  if (diff < 0) return { text: `期限超過・${formatMD(date)}`, tone: "overdue" };
  if (diff === 0) return { text: "今日まで", tone: "today" };
  if (diff === 1) return { text: "明日まで", tone: "tomorrow" };
  if (diff <= 7) return { text: `${formatMD(date)}まで`, tone: "week" };
  return { text: `${formatMD(date)}まで`, tone: "later" };
}

/* ============================================================
   カレンダー
   ============================================================ */
function MonthCalendar({ events, onOpenTask }) {
  const [y, setY] = useState(new Date().getFullYear());
  const [m, setM] = useState(new Date().getMonth());
  const first = new Date(y, m, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;
  const today = new Date();

  const byDate = {};
  events.forEach((e) => {
    if (!e.date) return;
    const key = `${e.date.getFullYear()}-${e.date.getMonth()}-${e.date.getDate()}`;
    (byDate[key] ||= []).push(e);
  });

  const cells = [];
  for (let i = 0; i < totalCells; i++) {
    const dayNum = i - startWeekday + 1;
    const cellDate = new Date(y, m, dayNum);
    const inMonth = dayNum >= 1 && dayNum <= daysInMonth;
    const key = `${cellDate.getFullYear()}-${cellDate.getMonth()}-${cellDate.getDate()}`;
    const dayEvents = byDate[key] || [];
    cells.push(
      <div key={i} className="min-h-[86px] border rounded-lg p-1.5" style={{ borderColor: COLOR.line, background: inMonth ? COLOR.card : "#FAFBFC", opacity: inMonth ? 1 : 0.5, boxShadow: sameDate(cellDate, today) ? `inset 0 0 0 2px ${COLOR.brand}` : "none" }}>
        <p className="text-xs mb-1" style={{ color: sameDate(cellDate, today) ? COLOR.brand : COLOR.sub, fontWeight: sameDate(cellDate, today) ? 700 : 400 }}>{cellDate.getDate()}</p>
        <div className="flex flex-col gap-1">
          {dayEvents.slice(0, 2).map((e, idx) => (
            <button key={idx} onClick={() => e.taskRef && onOpenTask && onOpenTask(e.taskRef)} className="text-[10px] px-1.5 py-0.5 rounded truncate text-left" style={{
              background: e.kind === "event" ? "#F1E9DC" : e.kind === "study" ? "#E7F3EE" : COLOR.brandBg,
              color: e.kind === "event" ? "#8A6A2E" : e.kind === "study" ? "#237A57" : COLOR.brandDark,
            }}>
              {e.title}
            </button>
          ))}
          {dayEvents.length > 2 && <span className="text-[10px]" style={{ color: COLOR.sub }}>+{dayEvents.length - 2}件</span>}
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-3">
          <button onClick={() => setM((v) => (v === 0 ? (setY(y - 1), 11) : v - 1))} className="w-8 h-8 rounded-full border flex items-center justify-center" style={{ borderColor: COLOR.line }}><Icon name="chevronLeft" size={16} /></button>
          <p className="font-bold" style={{ color: COLOR.text }}>{y}年{m + 1}月</p>
          <button onClick={() => setM((v) => (v === 11 ? (setY(y + 1), 0) : v + 1))} className="w-8 h-8 rounded-full border flex items-center justify-center" style={{ borderColor: COLOR.line }}><Icon name="chevronRight" size={16} /></button>
        </div>
        <button onClick={() => { setY(new Date().getFullYear()); setM(new Date().getMonth()); }} className="text-xs px-3 py-1.5 rounded-full border" style={{ borderColor: COLOR.line, color: COLOR.sub }}>今日</button>
      </div>
      <div className="grid grid-cols-7 gap-1.5 mb-1.5 text-center text-xs" style={{ color: COLOR.sub }}>
        <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
      </div>
      <div className="grid grid-cols-7 gap-1.5">{cells}</div>
    </div>
  );
}

/* ============================================================
   メインアプリ
   ============================================================ */
function PlanetteStudentDemo() {
  const [view, setView] = useState("home");
  const [previousView, setPreviousView] = useState("home");
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const [readNoticeIds, setReadNoticeIds] = useState([]);

  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [tasks, setTasks] = useState(INITIAL_TASKS);
  const [assignments] = useState(INITIAL_ASSIGNMENTS);
  const [projects, setProjects] = useState(PROJECTS);
  const [personalItems, setPersonalItems] = useState([]);
  const [goals, setGoals] = useState([{ id: "goal1", subject: "数学", text: "次回の定期テストで75点以上を取る" }]);
  const [reflections, setReflections] = useState([{ id: "r1", date: formatMD(addDays(-6)), text: "数学のケアレスミスが多かったので、見直しの時間を増やす。" }]);
  const [openAssignmentId, setOpenAssignmentId] = useState(null);
  const [openTimetableCell, setOpenTimetableCell] = useState(null);

  const myProjectTasks = useMemo(() => {
    const list = [];
    projects.forEach((pj) => pj.groups.forEach((g) => g.tasks.forEach((t) => {
      if (t.assignee === ME) list.push({ ...t, projectId: pj.id, projectName: pj.name, groupId: g.id, categoryId: pj.categoryId });
    })));
    return list;
  }, [projects]);

  const combinedTasks = useMemo(() => {
    const linked = myProjectTasks.map((t) => ({
      id: `proj-${t.id}`, title: `${t.projectName}：${t.title}`, detail: "", due: t.due,
      categoryId: t.categoryId, priority: "mid", status: t.status === "done" ? "done" : "todo",
      tags: [], fromProject: { projectId: t.projectId, groupId: t.groupId, taskId: t.id },
    }));
    return [...tasks, ...linked];
  }, [tasks, myProjectTasks]);

  function toggleTask(task) {
    if (task.fromProject) {
      const { projectId, groupId, taskId } = task.fromProject;
      setProjects((list) => list.map((pj) => pj.id !== projectId ? pj : {
        ...pj, groups: pj.groups.map((g) => g.id !== groupId ? g : {
          ...g, tasks: g.tasks.map((t) => t.id !== taskId ? t : { ...t, status: t.status === "done" ? "todo" : "done" }),
        }),
      }));
    } else {
      setTasks((list) => list.map((t) => (t.id === task.id ? { ...t, status: t.status === "done" ? "todo" : "done" } : t)));
    }
  }

  function cycleProjectTaskStatus(projectId, groupId, taskId) {
    const next = { todo: "doing", doing: "done", done: "todo" };
    setProjects((list) => list.map((pj) => pj.id !== projectId ? pj : {
      ...pj, groups: pj.groups.map((g) => g.id !== groupId ? g : {
        ...g, tasks: g.tasks.map((t) => t.id !== taskId ? t : { ...t, status: next[t.status] || "doing" }),
      }),
    }));
  }

  function updateProjectTask(projectId, groupId, taskId, updates) {
    setProjects((list) => list.map((pj) => pj.id !== projectId ? pj : {
      ...pj, groups: pj.groups.map((g) => g.id !== groupId ? g : {
        ...g, tasks: g.tasks.map((t) => t.id !== taskId ? t : { ...t, ...updates }),
      }),
    }));
  }

  function addTaskFromAssignment(a) {
    if (tasks.some((t) => t.assignmentId === a.id)) return;
    setTasks((list) => [...list, {
      id: `t-${a.id}`, title: a.title, detail: a.content, due: a.due,
      categoryId: "school", priority: "mid", status: "todo", tags: [], assignmentId: a.id,
    }]);
  }

  function submitAssignment(a) {
    setTasks((list) => {
      const exists = list.find((t) => t.assignmentId === a.id);
      if (exists) {
        return list.map((t) => (t.assignmentId === a.id ? { ...t, status: "done" } : t));
      }
      return [...list, {
        id: `t-${a.id}`, title: a.title, detail: a.content, due: a.due,
        categoryId: "school", priority: "mid", status: "done", tags: [], assignmentId: a.id,
      }];
    });
  }

  function addTaskFromNotice(n) {
    if (tasks.some((t) => t.noticeId === n.id)) return;
    setTasks((list) => [...list, {
      id: `t-notice-${n.id}`, title: n.title, detail: n.body, due: n.deadline,
      categoryId: n.categoryId || "other", priority: "mid", status: "todo", tags: [], noticeId: n.id,
    }]);
  }

  function openNotices() {
    setPreviousView(view);
    setView("notices");
  }
  function toggleNotices() {
    if (view === "notices") {
      setView(previousView);
    } else {
      openNotices();
    }
  }
  function markNoticeRead(id) {
    setReadNoticeIds((list) => (list.includes(id) ? list : [...list, id]));
  }

  function addPersonalTask({ title, detail, due, categoryId, priority }) {
    if (!title.trim()) return;
    setTasks((list) => [...list, { id: `t-${Date.now()}`, title, detail: detail || "", due, categoryId, priority, status: "todo", tags: [] }]);
  }

  function updateTask(id, updates) {
    setTasks((list) => list.map((t) => (t.id === id ? { ...t, ...updates } : t)));
  }

  function deleteTask(id) {
    setTasks((list) => list.filter((t) => t.id !== id));
  }

  const todayTasks = combinedTasks.filter((t) => t.status !== "done" && t.due && Math.round((t.due - startOfToday()) / 86400000) <= 0);
  const weekTasks = combinedTasks.filter((t) => {
    if (t.status === "done" || !t.due) return false;
    const diff = Math.round((t.due - startOfToday()) / 86400000);
    return diff > 0 && diff <= 7;
  });

  const weekdayIdx = new Date().getDay();
  const todayKey = DAYS[weekdayIdx - 1] || null;
  const tomorrowKey = DAYS[weekdayIdx] || null;
  const todaySchedule = todayKey ? TIMETABLE[todayKey] : [];
  const tomorrowSchedule = tomorrowKey ? TIMETABLE[tomorrowKey] : [];
  const scheduleItems = (sched) => sched.filter((c) => c.subject).flatMap((c) => c.items.map((it) => ({ subject: c.subject, item: it })));

  const studyPlan = useMemo(() => {
    const weak = TEST_SCORES
      .filter((t) => t.score - t.prev <= -5 && t.nextTest)
      .sort((a, b) => (a.score - a.prev) - (b.score - b.prev));
    return weak.slice(0, 2).flatMap((t) => {
      const sessionDates = [3, 2, 1]
        .map((n) => shiftDate(t.nextTest, -n))
        .filter((d) => d >= startOfToday());
      return sessionDates.map((d) => ({
        date: d, subject: t.subject, testDate: t.nextTest,
        reason: `前回のテストより${t.prev - t.score}点低下（${t.prev}点→${t.score}点）`,
      }));
    });
  }, []);

  const calendarEvents = useMemo(() => {
    const events = [];
    combinedTasks.forEach((t) => t.due && events.push({ date: t.due, title: t.title, kind: "task", taskRef: t }));
    events.push({ date: addDays(20), title: "文化祭", kind: "event" });
    studyPlan.forEach((s) => events.push({ date: s.date, title: `勉強計画：${s.subject}`, kind: "study" }));
    return events;
  }, [combinedTasks, studyPlan]);

  const submissionStats = useMemo(() => {
    const linkedAssignments = assignments.map((a) => {
      const t = tasks.find((x) => x.assignmentId === a.id);
      const submitted = t ? t.status === "done" : false;
      const overdue = t && t.status !== "done" && t.due && t.due < startOfToday();
      return { ...a, added: !!t, submitted, overdue };
    });
    const total = linkedAssignments.length;
    const submittedCount = linkedAssignments.filter((a) => a.submitted).length;
    const overdueCount = linkedAssignments.filter((a) => a.overdue).length;
    return { linkedAssignments, total, submittedCount, overdueCount, rate: total ? Math.round((submittedCount / total) * 100) : 0 };
  }, [assignments, tasks]);

  const pageTitle = view === "notices" ? "学校からのお知らせ" : (NAV.find((n) => n.key === view)?.label || "");
  const hasUnreadNotices = NOTICES.some((n) => !readNoticeIds.includes(n.id));

  function openAssignmentFromTimetable(id) {
    setOpenAssignmentId(id);
    setView("tasksAssignments");
  }

  return (
    <div className="h-screen w-full flex overflow-hidden" style={{ background: COLOR.page, color: COLOR.text, fontFamily: "'Noto Sans JP', sans-serif" }}>
      <FontStyle />

      <aside className="hidden md:flex md:flex-col w-64 shrink-0 h-full border-r px-3 py-5" style={{ borderColor: COLOR.line, background: COLOR.card }}>
        <SidebarContent view={view} setView={setView} />
      </aside>

      {mobileNavOpen && (
        <div className="fixed inset-0 z-40 md:hidden">
          <div className="absolute inset-0 bg-black/30" onClick={() => setMobileNavOpen(false)} />
          <aside className="absolute left-0 top-0 bottom-0 w-64 px-4 py-5 flex flex-col" style={{ background: COLOR.card }}>
            <div className="flex items-center justify-between mb-4">
              <div className="flex items-center gap-2"><PlanetteMark /><p className="font-bold text-lg">Planetté</p></div>
              <button onClick={() => setMobileNavOpen(false)}><Icon name="x" size={20} /></button>
            </div>
            <SidebarContent view={view} setView={(v) => { setView(v); setMobileNavOpen(false); }} />
          </aside>
        </div>
      )}

      <div className="flex-1 min-w-0 h-full flex flex-col">
        <header className="h-16 border-b flex items-center justify-between px-4 md:px-8 shrink-0" style={{ borderColor: COLOR.line, background: COLOR.card }}>
          <div className="flex items-center gap-3">
            <button className="md:hidden" onClick={() => setMobileNavOpen(true)}><Icon name="menu" size={22} /></button>
            <p className="font-bold text-base">{pageTitle}</p>
          </div>
          <div className="flex items-center gap-3 relative">
            <button onClick={toggleNotices} className="relative w-9 h-9 rounded-full flex items-center justify-center border" style={{ borderColor: view === "notices" ? COLOR.brand : COLOR.line, background: view === "notices" ? COLOR.brandBg : "transparent" }}>
              <Icon name="bell" size={16} color={view === "notices" ? COLOR.brandDark : COLOR.text} />
              {hasUnreadNotices && <span className="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-rose-500" />}
            </button>
            <span className="hidden sm:flex items-center gap-2 text-xs" style={{ color: COLOR.sub }}>
              <span className="w-7 h-7 rounded-full flex items-center justify-center text-xs font-semibold" style={{ background: COLOR.brandBg, color: COLOR.brandDark }}>早</span>
              早稲田 太郎（2年1組）

        <main className="flex-1 min-h-0 overflow-y-auto p-4 md:p-8 pb-20 md:pb-8">

            </div>
            {personalItems.length > 0 && (
              <div className="flex flex-wrap gap-1.5 mb-3">

          <Card>
            <div className="divide-y" style={{ borderColor: COLOR.line }}>
              {NOTICES.slice(0, 2).map((n) => (
                <div key={n.id} className="px-4 py-3">
                  <p className="text-sm font-medium">{n.title}</p>

          <Card className="p-4 flex flex-col gap-3">

              const allTasks = pj.groups.flatMap((g) => g.tasks);
              const weight = allTasks.reduce((s, t) => s + (t.status === "done" ? 1 : t.status === "doing" ? 0.5 : 0), 0);

/* ============================================================
   タスク（一覧 + 学校からの課題）
   ============================================================ */
function TasksView({ tasks, categories, toggleTask, addPersonalTask, updateTask, deleteTask, assignments, addTaskFromAssignment, submitAssignment, openAssignmentId, setOpenAssignmentId, submissionStats, initialTab, setView }) {
  const [tab, setTab] = useState(initialTab || "tasks");
  const [filter, setFilter] = useState("all");
  const [sortBy, setSortBy] = useState("due");
  const [groupByCategory, setGroupByCategory] = useState(false);
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const emptyForm = { title: "", detail: "", categoryId: categories[0]?.id, priority: "mid", dueDate: toInputDate(addDays(3)) };
  const [form, setForm] = useState(emptyForm);
  const formRef = useRef(null);

  function scrollToForm() {
    setTimeout(() => formRef.current?.scrollIntoView({ behavior: "smooth", block: "start" }), 0);
  }
  function openAddForm() {
    setEditingId(null);
    setForm(emptyForm);
    setShowForm(true);
    scrollToForm();
  }
  function openEditForm(t) {
    setEditingId(t.id);
    setForm({
      title: t.title, detail: t.detail || "", categoryId: t.categoryId,
      priority: t.priority || "mid", dueDate: toInputDate(t.due),
    });
    setShowForm(true);
    scrollToForm();
  }
  function closeForm() {
    setShowForm(false);
    setEditingId(null);
    setForm(emptyForm);
  }
  function saveForm() {
    if (!form.title.trim()) return;
    const payload = { title: form.title, detail: form.detail, categoryId: form.categoryId, priority: form.priority, due: fromInputDate(form.dueDate) };
    if (editingId) {
      updateTask(editingId, payload);
    } else {
      addPersonalTask(payload);
    }
    closeForm();
  }
  function removeTask() {
    if (editingId) deleteTask(editingId);
    closeForm();
  }

  const filtered = tasks.filter((t) => {
    const diff = t.due ? Math.round((t.due - startOfToday()) / 86400000) : null;
    if (filter === "incomplete") return t.status !== "done";
    if (filter === "today") return t.status !== "done" && diff !== null && diff <= 0;
    if (filter === "week") return t.status !== "done" && diff !== null && diff > 0 && diff <= 7;
    if (filter === "overdue") return t.status !== "done" && diff !== null && diff < 0;
    if (filter === "done") return t.status === "done";
    return true;
  });
  const sorted = [...filtered].sort((a, b) => {
    if (sortBy === "priority") {
      const order = { high: 0, mid: 1, low: 2 };
      return (order[a.priority] ?? 3) - (order[b.priority] ?? 3);
    }
    return (a.due || Infinity) - (b.due || Infinity);
  });

  return (
    <div className="max-w-3xl mx-auto w-full">
      <div className="flex gap-2 mb-6 border-b" style={{ borderColor: COLOR.line }}>
        {[["tasks", "タスク"], ["assignments", "学校からの課題"]].map(([key, label]) => (
          <button key={key} onClick={() => setTab(key)} className="px-4 py-2.5 text-sm font-medium -mb-px border-b-2" style={{ borderColor: tab === key ? COLOR.brand : "transparent", color: tab === key ? COLOR.brandDark : COLOR.sub }}>
            {label}
          </button>
        ))}
      </div>

      {tab === "tasks" && (
        <>
          <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
            <div className="flex flex-wrap gap-2">
              {[["all", "すべて"], ["incomplete", "未完了"], ["today", "今日"], ["week", "今週"], ["overdue", "期限超過"], ["done", "完了済み"]].map(([key, label]) => (
                <button key={key} onClick={() => setFilter(key)} className="text-xs px-3 py-1.5 rounded-full border" style={{ borderColor: filter === key ? COLOR.brand : COLOR.line, background: filter === key ? COLOR.brandBg : "transparent", color: filter === key ? COLOR.brandDark : COLOR.sub }}>
                  {label}
                </button>
              ))}
            </div>
            <div className="flex items-center gap-2">
              <div className="flex rounded-lg border overflow-hidden" style={{ borderColor: COLOR.line }}>
                <button onClick={() => setGroupByCategory(false)} className="text-xs px-3 py-1.5" style={{ background: !groupByCategory ? COLOR.brandBg : COLOR.card, color: !groupByCategory ? COLOR.brandDark : COLOR.sub }}>リスト</button>
                <button onClick={() => setGroupByCategory(true)} className="text-xs px-3 py-1.5" style={{ background: groupByCategory ? COLOR.brandBg : COLOR.card, color: groupByCategory ? COLOR.brandDark : COLOR.sub }}>カテゴリ別</button>
              </div>
              <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="text-xs border rounded-lg px-2 py-1.5" style={{ borderColor: COLOR.line }}>
                <option value="due">期限順</option>
                <option value="priority">優先度順</option>
              </select>
              <button onClick={openAddForm} className="flex items-center gap-1 text-xs font-semibold px-3 py-1.5 rounded-full text-white" style={{ background: COLOR.brand }}>
                <Icon name="plus" size={13} /> 追加
              </button>
            </div>
          </div>

          {showForm && (
            <div ref={formRef}>
            <Card className="p-4 mb-4 flex flex-col gap-3">
              <p className="text-xs font-semibold" style={{ color: COLOR.sub }}>{editingId ? "タスクを編集" : "新しいタスク"}</p>
              <input value={form.title} onChange={(e) => setForm((f) => ({ ...f, title: e.target.value }))} placeholder="タスク名" className="text-sm border rounded-lg px-3 py-2" style={{ borderColor: COLOR.line }} />
              <textarea value={form.detail} onChange={(e) => setForm((f) => ({ ...f, detail: e.target.value }))} placeholder="詳細（任意）" rows={2} className="text-sm border rounded-lg px-3 py-2" style={{ borderColor: COLOR.line }} />
              <div className="flex flex-wrap gap-2">
                <select value={form.categoryId} onChange={(e) => setForm((f) => ({ ...f, categoryId: e.target.value }))} className="text-xs border rounded-lg px-2 py-1.5" style={{ borderColor: COLOR.line }}>
                  {categories.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}
                </select>
                <select value={form.priority} onChange={(e) => setForm((f) => ({ ...f, priority: e.target.value }))} className="text-xs border rounded-lg px-2 py-1.5" style={{ borderColor: COLOR.line }}>
                  <option value="high">優先度：高</option>
                  <option value="mid">優先度：中</option>
                  <option value="low">優先度：低</option>
                </select>
                <label className="flex items-center gap-1.5 text-xs border rounded-lg px-2 py-1.5" style={{ borderColor: COLOR.line, color: COLOR.sub }}>
                  期限
                  <input type="date" value={form.dueDate} onChange={(e) => setForm((f) => ({ ...f, dueDate: e.target.value }))} className="text-xs border-0 p-0 focus:outline-none" style={{ color: COLOR.text }} />
                </label>
              </div>
              <div className="flex items-center justify-between">
                <div>
                  {editingId && (
                    <button onClick={removeTask} className="text-xs font-medium px-3 py-2 rounded-full" style={{ color: "#D64545" }}>
                      このタスクを削除
                    </button>
                  )}
                </div>
                <div className="flex items-center gap-2">
                  <button onClick={closeForm} className="text-xs font-medium px-3 py-2 rounded-full" style={{ color: COLOR.sub }}>キャンセル</button>
                  <button onClick={saveForm} className="text-xs font-semibold px-4 py-2 rounded-full text-white" style={{ background: COLOR.brandDark }}>
                    {editingId ? "変更を保存" : "このタスクを追加"}
                  </button>
                </div>
              </div>
            </Card>
            </div>
          )}

          {groupByCategory ? (
            sorted.length === 0 ? (
              <Card className="px-4"><EmptyNote>該当するタスクがありません。</EmptyNote></Card>
            ) : (
              <div className="flex flex-col gap-5">
                {categories.map((c) => {
                  const items = sorted.filter((t) => t.categoryId === c.id);
                  if (items.length === 0) return null;
                  return (
                    <div key={c.id}>
                      <p className="text-xs font-semibold mb-2 flex items-center gap-2" style={{ color: COLOR.sub }}>
                        {c.label}
                        <span className="text-[10px] font-normal px-2 py-0.5 rounded-full" style={{ background: COLOR.brandBg, color: COLOR.brandDark }}>{items.length}</span>
                      </p>
                      <Card className="px-4">
                        {items.map((t) => (
                          <TaskRow
                            key={t.id} task={t} categories={categories} onToggle={() => toggleTask(t)}
                            onEdit={t.fromProject ? null : () => openEditForm(t)}
                            onNavigate={t.fromProject ? () => setView("projects") : null}
                          />
                        ))}
                      </Card>
                    </div>
                  );
                })}
              </div>
            )
          ) : (
            <Card className="px-4">
              {sorted.length === 0 ? <EmptyNote>該当するタスクがありません。</EmptyNote> : sorted.map((t) => (
                <TaskRow
                  key={t.id} task={t} categories={categories} onToggle={() => toggleTask(t)}
                  onEdit={t.fromProject ? null : () => openEditForm(t)}
                  onNavigate={t.fromProject ? () => setView("projects") : null}
                />
              ))}
            </Card>
          )}
        </>
      )}

      {tab === "assignments" && (
        <>
          <Card className="p-4 mb-4 flex items-center justify-between">
            <div>
              <p className="text-xs" style={{ color: COLOR.sub }}>提出率</p>
              <p className="text-xl font-black">{submissionStats.submittedCount} / {submissionStats.total}件</p>
            </div>
            <div className="w-40"><ProgressBar value={submissionStats.rate} /></div>
          </Card>
          <div className="flex flex-col gap-3">
            {submissionStats.linkedAssignments.map((a) => {
              const open = openAssignmentId === a.id;
              return (
                <Card key={a.id}>
                  <div className="px-5 py-4 flex items-center gap-3">
                    <button onClick={() => setOpenAssignmentId(open ? null : a.id)} className="flex-1 min-w-0 text-left flex items-center gap-2">
                      <Icon name={open ? "chevronUp" : "chevronDown"} size={14} color={COLOR.sub} className="shrink-0" />
                      <span className="min-w-0">
                        <span className="block text-xs" style={{ color: COLOR.sub }}>{a.subject}</span>
                        <span className="block text-sm font-semibold truncate">{a.title}</span>
                      </span>
                    </button>
                    <span className="text-xs px-2.5 py-1 rounded-full shrink-0" style={{
                      background: a.submitted ? "#E8F5EC" : a.overdue ? "#FBEAEA" : "#FDF3E7",
                      color: a.submitted ? "#2F9E56" : a.overdue ? "#D64545" : "#B8791E",
                    }}>
                      {a.submitted ? "提出済み" : a.overdue ? "期限超過" : "未提出"}
                    </span>
                    {a.submitted ? (
                      <button onClick={() => toggleTask({ id: `t-${a.id}`, status: "done" })} className="shrink-0 flex items-center gap-1.5 text-xs font-medium px-3 py-2 rounded-full border" style={{ borderColor: COLOR.line, color: COLOR.sub }}>
                        取り消す
                      </button>
                    ) : (
                      <button onClick={() => submitAssignment(a)} className="shrink-0 flex items-center gap-1.5 text-xs font-semibold px-4 py-2 rounded-full text-white" style={{ background: COLOR.brandDark }}>
                        <Icon name="check" size={13} /> 提出する
                      </button>
                    )}
                  </div>
                  {open && (
                    <div className="px-5 pb-5 border-t pt-4" style={{ borderColor: COLOR.line }}>
                      <p className="text-sm mb-3 leading-relaxed" style={{ color: COLOR.text }}>{a.content}</p>
                      <div className="grid grid-cols-2 gap-2 text-xs mb-4" style={{ color: COLOR.sub }}>
                        <p>期限：{formatMD(a.due)}</p>
                        <p>提出方法：{a.method}</p>
                        <p>対象：{a.target}</p>
                        <p>関連授業：{a.relatedClass}</p>
                      </div>
                      {!a.added && (
                        <button onClick={() => addTaskFromAssignment(a)} className="flex items-center gap-1.5 text-xs font-semibold px-4 py-2 rounded-full" style={{ background: COLOR.brandBg, color: COLOR.brandDark }}>
                          <Icon name="plus" size={13} /> 提出はまだ・タスクにだけ追加する
                        </button>
                      )}
                    </div>
                  )}
                </Card>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

/* ============================================================
   時間割
   ============================================================ */
function TimetableView({ todayKey, openTimetableCell, setOpenTimetableCell, assignments, onOpenAssignment }) {
  return (
    <div className="max-w-4xl mx-auto w-full">
      <div className="overflow-x-auto">
        <div className="grid grid-cols-6 gap-1.5 min-w-[560px]">
          <div />
          {DAYS.map((d) => (
            <div key={d} className="text-center text-xs font-semibold py-2 rounded-lg" style={{ color: d === todayKey ? COLOR.brandDark : COLOR.sub, background: d === todayKey ? COLOR.brandBg : "transparent" }}>{d}曜</div>
          ))}
          {PERIODS.map((p) => (
            <React.Fragment key={p}>
              <div className="text-xs flex items-center justify-center" style={{ color: COLOR.sub }}>{p}限</div>
              {DAYS.map((d) => {
                const cell = TIMETABLE[d].find((c) => c.period === p);
                return (
                  <button
                    key={d + p}
                    onClick={() => cell.subject && setOpenTimetableCell(cell)}
                    disabled={!cell.subject}
                    className="rounded-lg border text-xs py-3 px-1 text-center transition-colors disabled:opacity-40"
                    style={{ borderColor: COLOR.line, background: d === todayKey && cell.subject ? "#FBFDFD" : COLOR.card }}
                  >
                    {cell.subject || "―"}
                  </button>
                );
              })}
            </React.Fragment>
          ))}
        </div>
      </div>

      {openTimetableCell && (
        <div className="fixed inset-0 z-40 flex items-center justify-center p-6" onClick={() => setOpenTimetableCell(null)}>
          <div className="absolute inset-0 bg-black/30" />
          <div className="relative bg-white rounded-xl border max-w-sm w-full p-5" style={{ borderColor: COLOR.line }} onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-3">
              <p className="text-lg font-bold">{openTimetableCell.subject}</p>
              <button onClick={() => setOpenTimetableCell(null)}><Icon name="x" size={18} /></button>
            </div>
            <div className="flex flex-col gap-2 text-sm mb-4">
              <p className="flex items-center gap-2" style={{ color: COLOR.sub }}><Icon name="mapPin" size={14} />{openTimetableCell.room}</p>
              <p className="flex items-center gap-2" style={{ color: COLOR.sub }}><Icon name="userRound" size={14} />{openTimetableCell.teacher}</p>
              <p className="flex items-center gap-2" style={{ color: COLOR.sub }}><Icon name="package" size={14} />{openTimetableCell.items.join("、") || "特になし"}</p>
            </div>
            <p className="text-xs font-semibold mb-2" style={{ color: COLOR.sub }}>関連課題</p>
            <div className="flex flex-col gap-2">
              {openTimetableCell.relatedAssignmentIds.length === 0 && <p className="text-xs" style={{ color: COLOR.sub }}>現在ありません</p>}
              {openTimetableCell.relatedAssignmentIds.map((id) => {
                const a = assignments.find((x) => x.id === id);
                if (!a) return null;
                return (
                  <button key={id} onClick={() => { setOpenTimetableCell(null); onOpenAssignment(id); }} className="text-left text-xs px-3 py-2 rounded-lg border flex items-center justify-between" style={{ borderColor: COLOR.line }}>
                    {a.title}<Icon name="arrowRight" size={12} />
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   プロジェクト
   ============================================================ */
function ProjectsView({ projects, onCycleStatus, onUpdateTask }) {
  const [openId, setOpenId] = useState(projects[0]?.id ?? null);
  const [editing, setEditing] = useState(null); // { projectId, groupId, taskId }
  const [taskForm, setTaskForm] = useState({ title: "", assignee: "", dueDate: "" });

  function startEdit(pj, g, t) {
    setEditing({ projectId: pj.id, groupId: g.id, taskId: t.id });
    setTaskForm({ title: t.title, assignee: t.assignee, dueDate: toInputDate(t.due) });
  }
  function cancelEdit() {
    setEditing(null);
  }
  function saveEdit() {
    if (!taskForm.title.trim() || !editing) return;
    onUpdateTask(editing.projectId, editing.groupId, editing.taskId, {
      title: taskForm.title, assignee: taskForm.assignee, due: fromInputDate(taskForm.dueDate),
    });
    setEditing(null);
  }

  return (
    <div className="max-w-3xl mx-auto w-full flex flex-col gap-4">
      {projects.map((pj) => {
        const allTasks = pj.groups.flatMap((g) => g.tasks);
        const weight = allTasks.reduce((s, t) => s + (t.status === "done" ? 1 : t.status === "doing" ? 0.5 : 0), 0);
        const progress = Math.round((weight / allTasks.length) * 100);
        const open = openId === pj.id;
        const memberLoad = {};
        allTasks.forEach((t) => { memberLoad[t.assignee] = (memberLoad[t.assignee] || 0) + 1; });

        return (
          <Card key={pj.id}>
            <button onClick={() => setOpenId(open ? null : pj.id)} className="w-full text-left px-5 py-4">
              <div className="flex items-center justify-between mb-2">
                <div>
                  <p className="text-base font-bold">{pj.name}</p>
                  <p className="text-xs mt-0.5" style={{ color: COLOR.sub }}>{pj.summary}</p>
                </div>
                <span className="text-lg font-black shrink-0" style={{ color: COLOR.brandDark }}>{progress}%</span>
              </div>
              <ProgressBar value={progress} />
            </button>
            {open && pj.groups.map((g) => (
              <div key={g.id} className="px-5 pb-5 border-t pt-4" style={{ borderColor: COLOR.line }}>
                <p className="text-xs mb-3" style={{ color: COLOR.sub }}>{g.name}・メンバー：{g.members.join("・")}</p>
                <p className="text-[11px] mb-2" style={{ color: COLOR.sub }}>○をタップすると 未着手 → 進行中 → 完了 の順に切り替わります</p>
                <div className="flex flex-col">
                  {g.tasks.map((t) => {
                    const isEditing = editing && editing.taskId === t.id;
                    if (isEditing) {
                      return (
                        <div key={t.id} className="py-3 border-b last:border-b-0" style={{ borderColor: COLOR.line }}>
                          <div className="flex flex-col gap-2 rounded-lg p-3" style={{ background: COLOR.brandBg }}>
                            <input value={taskForm.title} onChange={(e) => setTaskForm((f) => ({ ...f, title: e.target.value }))} placeholder="タスク名" className="text-sm border rounded-lg px-3 py-2" style={{ borderColor: COLOR.line }} />
                            <div className="flex flex-wrap gap-2">
                              <select value={taskForm.assignee} onChange={(e) => setTaskForm((f) => ({ ...f, assignee: e.target.value }))} className="text-xs border rounded-lg px-2 py-1.5" style={{ borderColor: COLOR.line }}>
                                {g.members.map((m) => <option key={m} value={m}>{m}</option>)}
                              </select>
                              <label className="flex items-center gap-1.5 text-xs border rounded-lg px-2 py-1.5" style={{ borderColor: COLOR.line, color: COLOR.sub }}>
                                期限
                                <input type="date" value={taskForm.dueDate} onChange={(e) => setTaskForm((f) => ({ ...f, dueDate: e.target.value }))} className="text-xs border-0 p-0 focus:outline-none" style={{ color: COLOR.text }} />
                              </label>
                            </div>
                            <div className="flex items-center justify-end gap-2">
                              <button onClick={cancelEdit} className="text-xs font-medium px-3 py-1.5 rounded-full" style={{ color: COLOR.sub }}>キャンセル</button>
                              <button onClick={saveEdit} className="text-xs font-semibold px-4 py-1.5 rounded-full text-white" style={{ background: COLOR.brandDark }}>保存</button>
                            </div>
                          </div>
                        </div>
                      );
                    }
                    return (
                      <div
                        key={t.id}
                        className="flex items-center gap-3 py-2.5 px-2.5 -mx-2.5 border-b last:border-b-0 rounded-lg transition-colors"
                        style={{ borderColor: COLOR.line, background: t.status === "doing" ? COLOR.brandBg : "transparent" }}
                      >
                        <button
                          onClick={() => onCycleStatus(pj.id, g.id, t.id)}
                          className="shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center"
                          style={{ borderColor: t.status === "done" ? COLOR.brandDark : t.status === "doing" ? COLOR.brand : "#CBD5D9", background: t.status === "done" ? COLOR.brandDark : "transparent" }}
                        >
                          {t.status === "done" && <Icon name="check" size={13} className="text-white" />}
                          {t.status === "doing" && <Icon name="circle" size={7} style={{ fill: COLOR.brand, color: COLOR.brand }} />}
                        </button>
                        <div className="flex-1 min-w-0">
                          <p className={`text-sm ${t.status === "done" ? "line-through" : t.status === "doing" ? "font-semibold" : ""}`} style={{ color: t.status === "done" ? COLOR.sub : t.status === "doing" ? COLOR.brandDark : COLOR.text }}>{t.title}</p>
                          <p className="text-xs mt-0.5" style={{ color: COLOR.sub }}>担当：{t.assignee}{t.assignee === ME && "（あなた）"}</p>
                        </div>
                        <span className="text-xs shrink-0" style={{ color: COLOR.sub }}>{formatMD(t.due)}</span>
                        <button onClick={() => startEdit(pj, g, t)} aria-label="編集" className="shrink-0 w-7 h-7 rounded-full flex items-center justify-center border" style={{ borderColor: COLOR.line, color: COLOR.sub }}>
                          <Icon name="edit" size={12} />
                        </button>
                      </div>
                    );
                  })}
                </div>
                <p className="text-xs font-semibold mt-4 mb-2" style={{ color: COLOR.sub }}>担当タスク数</p>
                <div className="flex flex-wrap gap-4">
                  {Object.entries(memberLoad).map(([name, count]) => (
                    <div key={name} className="text-center">
                      <p className="text-lg font-black">{count}</p>
                      <p className="text-[10px]" style={{ color: COLOR.sub }}>{name}</p>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </Card>
        );
      })}
    </div>
  );
}

/* ============================================================
   学習
   ============================================================ */
function LearningView({ submissionStats, testScores, goals, setGoals, reflections, setReflections }) {
  const [goalText, setGoalText] = useState("");
  const [goalSubject, setGoalSubject] = useState("数学");
  const [reflectionText, setReflectionText] = useState("");
  const avgDelta = Math.round(testScores.reduce((s, t) => s + (t.score - t.prev), 0) / testScores.length);
  const worst = [...testScores].sort((a, b) => (a.score - a.prev) - (b.score - b.prev))[0];

  return (
    <div className="max-w-3xl mx-auto w-full">
      <div className="grid grid-cols-3 gap-3 mb-8">
        <Card className="p-4"><p className="text-xs mb-1" style={{ color: COLOR.sub }}>課題提出率</p><p className="text-xl font-black">{submissionStats.rate}%</p></Card>
        <Card className="p-4"><p className="text-xs mb-1" style={{ color: COLOR.sub }}>期限超過</p><p className="text-xl font-black text-rose-600">{submissionStats.overdueCount}件</p></Card>
        <Card className="p-4"><p className="text-xs mb-1" style={{ color: COLOR.sub }}>平均点の変化</p><p className={`text-xl font-black ${avgDelta < 0 ? "text-rose-600" : ""}`}>{avgDelta > 0 ? "+" : ""}{avgDelta}点</p></Card>
      </div>

      {worst && worst.score - worst.prev < -5 && (
        <Card className="p-4 mb-8" style={{ background: COLOR.brandBg, border: "none" }}>
          <p className="text-sm font-semibold" style={{ color: COLOR.brandDark }}>{worst.subject}を優先して復習することをおすすめします</p>
          <p className="text-xs mt-1" style={{ color: COLOR.brandDark }}>前回のテストより{worst.prev - worst.score}点低下しています（{worst.prev}点 → {worst.score}点）。</p>
        </Card>
      )}

      <SectionHeading title="教科別 提出・テスト状況" />
      <Card className="px-5 mb-8">
        {testScores.map((t) => (
          <div key={t.subject} className="flex items-center justify-between py-3 border-b last:border-b-0 text-sm" style={{ borderColor: COLOR.line }}>
            <span className="font-medium">{t.subject}</span>
            <span style={{ color: COLOR.sub }}>{t.prev}点 → <span style={{ color: COLOR.text, fontWeight: 600 }}>{t.score}点</span></span>
          </div>
        ))}
      </Card>

      <SectionHeading title="目標" />
      <Card className="p-4 mb-3">
        {goals.map((g) => (
          <p key={g.id} className="text-sm mb-1">【{g.subject}】{g.text}</p>
        ))}
      </Card>
      <div className="flex gap-2 mb-8">
        <select value={goalSubject} onChange={(e) => setGoalSubject(e.target.value)} className="text-xs border rounded-lg px-2" style={{ borderColor: COLOR.line }}>
          {testScores.map((t) => <option key={t.subject}>{t.subject}</option>)}
        </select>
        <input value={goalText} onChange={(e) => setGoalText(e.target.value)} placeholder="新しい目標を入力" className="flex-1 text-sm border rounded-lg px-3 py-2" style={{ borderColor: COLOR.line }} />
        <button onClick={() => { if (goalText.trim()) { setGoals((g) => [...g, { id: `g${Date.now()}`, subject: goalSubject, text: goalText.trim() }]); setGoalText(""); } }} className="text-xs font-semibold px-4 rounded-lg text-white" style={{ background: COLOR.brand }}>追加</button>
      </div>

      <SectionHeading title="振り返り" />
      <Card className="px-5 mb-3">
        {reflections.map((r) => (
          <div key={r.id} className="py-3 border-b last:border-b-0">
            <p className="text-sm">{r.text}</p>
            <p className="text-xs mt-1" style={{ color: COLOR.sub }}>{r.date}</p>
          </div>
        ))}
      </Card>
      <div className="flex gap-2">
        <input value={reflectionText} onChange={(e) => setReflectionText(e.target.value)} placeholder="振り返りを記録する" className="flex-1 text-sm border rounded-lg px-3 py-2" style={{ borderColor: COLOR.line }} />
        <button onClick={() => { if (reflectionText.trim()) { setReflections((r) => [{ id: `r${Date.now()}`, text: reflectionText.trim(), date: formatMD(new Date()) }, ...r]); setReflectionText(""); } }} className="text-xs font-semibold px-4 rounded-lg text-white" style={{ background: COLOR.brand }}>記録</button>
      </div>
    </div>
  );
}

/* ============================================================
   成績
   ============================================================ */
function SimpleBarChart({ data }) {
  const W = 640, H = 260, padL = 32, padB = 28, padT = 10;
  const chartW = W - padL - 12, chartH = H - padT - padB;
  const groupW = chartW / data.length;
  const barW = Math.min(28, groupW / 3);
  const yFor = (v) => padT + chartH * (1 - v / 100);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto">
      {[0, 25, 50, 75, 100].map((v) => (
        <g key={v}>
          <line x1={padL} x2={W - 8} y1={yFor(v)} y2={yFor(v)} stroke={COLOR.line} strokeWidth="1" />
          <text x={padL - 8} y={yFor(v) + 4} fontSize="11" fill={COLOR.sub} textAnchor="end">{v}</text>
        </g>
      ))}
      {data.map((d, i) => {
        const cx = padL + groupW * i + groupW / 2;
        return (
          <g key={d.subject}>
            <rect x={cx - barW - 3} y={yFor(d.prev)} width={barW} height={chartH - (yFor(d.prev) - padT)} fill="#CBD9DE" rx="3" />
            <rect x={cx + 3} y={yFor(d.score)} width={barW} height={chartH - (yFor(d.score) - padT)} fill={COLOR.brand} rx="3" />
            <text x={cx} y={H - 8} fontSize="12" fill={COLOR.sub} textAnchor="middle">{d.subject}</text>
          </g>
        );
      })}
      <g transform={`translate(${W - 150}, 4)`}>
        <rect width="10" height="10" fill="#CBD9DE" rx="2" /><text x="14" y="9" fontSize="11" fill={COLOR.sub}>前回</text>
        <rect x="60" width="10" height="10" fill={COLOR.brand} rx="2" /><text x="74" y="9" fontSize="11" fill={COLOR.sub}>今回</text>
      </g>
    </svg>
  );
}

function GradesView({ testScores }) {
  return (
    <div className="max-w-3xl mx-auto w-full">
      <SectionHeading title="教科別成績" />
      <Card className="p-5 mb-8">
        <SimpleBarChart data={testScores} />
      </Card>

      <SectionHeading title="成績推移" />
      <Card className="px-5">
        {testScores.map((t) => {
          const delta = t.score - t.prev;
          return (
            <div key={t.subject} className="flex items-center justify-between py-3 border-b last:border-b-0 text-sm" style={{ borderColor: COLOR.line }}>
              <span className="font-medium">{t.subject}</span>
              <span className={delta < 0 ? "text-rose-600" : delta > 0 ? "text-emerald-600" : ""} style={{ color: delta === 0 ? COLOR.sub : undefined }}>
                {delta > 0 ? "+" : ""}{delta}点
              </span>
            </div>
          );
        })}
      </Card>
    </div>
  );
}

/* ============================================================
   検索
   ============================================================ */
function SearchView({ tasks, assignments, projects, notices, setView }) {
  const [q, setQ] = useState("");
  const query = q.trim().toLowerCase();

  const results = useMemo(() => {
    if (!query) return null;
    const taskHits = tasks.filter((t) => t.title.toLowerCase().includes(query));
    const assignHits = assignments.filter((a) => a.title.toLowerCase().includes(query) || a.subject.toLowerCase().includes(query));
    const projectHits = projects.filter((p) => p.name.toLowerCase().includes(query) || p.summary.toLowerCase().includes(query));
    const noticeHits = notices.filter((n) => n.title.toLowerCase().includes(query) || n.body.toLowerCase().includes(query));
    return { taskHits, assignHits, projectHits, noticeHits };
  }, [query, tasks, assignments, projects, notices]);

  return (
    <div className="max-w-2xl mx-auto w-full">
      <div className="relative mb-6">
        <Icon name="search" size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2" style={{ color: COLOR.sub }} />
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="タスク・課題・プロジェクト・連絡を検索" className="w-full text-sm border rounded-xl pl-10 pr-4 py-3" style={{ borderColor: COLOR.line }} />
      </div>

      {!results && <p className="text-sm" style={{ color: COLOR.sub }}>キーワードを入力してください。</p>}

      {results && (
        <div className="flex flex-col gap-6">
          <ResultGroup label="タスク" onOpen={() => setView("tasks")}>
            {results.taskHits.map((t) => <p key={t.id} className="text-sm py-2 border-b last:border-b-0" style={{ borderColor: COLOR.line }}>{t.title}</p>)}
          </ResultGroup>
          <ResultGroup label="学校からの課題" onOpen={() => setView("tasksAssignments")}>
            {results.assignHits.map((a) => <p key={a.id} className="text-sm py-2 border-b last:border-b-0" style={{ borderColor: COLOR.line }}>【{a.subject}】{a.title}</p>)}
          </ResultGroup>
          <ResultGroup label="プロジェクト" onOpen={() => setView("projects")}>
            {results.projectHits.map((p) => <p key={p.id} className="text-sm py-2 border-b last:border-b-0" style={{ borderColor: COLOR.line }}>{p.name}</p>)}
          </ResultGroup>
          <ResultGroup label="学校からの連絡" onOpen={() => {}}>
            {results.noticeHits.map((n) => <p key={n.id} className="text-sm py-2 border-b last:border-b-0" style={{ borderColor: COLOR.line }}>{n.title}</p>)}
          </ResultGroup>
        </div>
      )}
    </div>
  );
}
function ResultGroup({ label, children, onOpen }) {
  const arr = React.Children.toArray(children);
  if (arr.length === 0) return null;
  return (
    <div>
      <button onClick={onOpen} className="text-xs font-semibold mb-1.5 flex items-center gap-1" style={{ color: COLOR.sub }}>{label} <Icon name="arrowRight" size={11} /></button>
      <Card className="px-4">{children}</Card>
    </div>
  );
}

/* ============================================================
   学校からのお知らせ
   ============================================================ */
function NoticesView({ tasks, addTaskFromNotice, setView, readNoticeIds, onOpenNotice }) {
  const [openId, setOpenId] = useState(null);
  return (
    <div className="max-w-2xl mx-auto w-full flex flex-col gap-3">
      {NOTICES.map((n) => {
        const open = openId === n.id;
        const added = tasks.some((t) => t.noticeId === n.id);
        const unread = !readNoticeIds.includes(n.id);
        return (
          <Card key={n.id}>
            <button
              onClick={() => {
                const willOpen = !open;
                setOpenId(willOpen ? n.id : null);
                if (willOpen) onOpenNotice(n.id);
              }}
              className="w-full text-left px-5 py-4 flex items-center justify-between gap-3"
            >
              <span className="flex items-start gap-2">
                {unread && <span className="mt-1.5 w-2 h-2 rounded-full shrink-0 bg-rose-500" />}
                <span>
                  <span className="block text-sm font-semibold">{n.title}</span>
                  <span className="block text-xs mt-1" style={{ color: COLOR.sub }}>{n.from}・{n.date}</span>
                </span>
              </span>
              {n.deadline && (
                <span className="text-xs px-2.5 py-1 rounded-full shrink-0" style={{ background: added ? "#E7F3EE" : COLOR.brandBg, color: added ? "#237A57" : COLOR.brandDark }}>
                  {added ? "タスク追加済み" : "タスク化できます"}
                </span>
              )}
            </button>
            {open && (
              <div className="px-5 pb-5 border-t pt-4" style={{ borderColor: COLOR.line }}>
                <p className="text-sm leading-relaxed mb-4" style={{ color: COLOR.text }}>{n.body}</p>
                {n.deadline && (
                  <div className="flex items-center gap-3">
                    {!added ? (
                      <button onClick={() => addTaskFromNotice(n)} className="flex items-center gap-1.5 text-xs font-semibold px-4 py-2 rounded-full text-white" style={{ background: COLOR.brand }}>
                        <Icon name="plus" size={13} /> タスクに追加（期限：{formatMD(n.deadline)}）
                      </button>
                    ) : (
                      <>
                        <span className="text-xs px-4 py-2 rounded-full" style={{ background: "#E7F3EE", color: "#237A57" }}>タスクに追加済みです</span>
                        <button onClick={() => setView("tasks")} className="text-xs flex items-center gap-1" style={{ color: COLOR.sub }}>タスクで確認する <Icon name="arrowRight" size={11} /></button>
                      </>
                    )}
                  </div>
                )}
              </div>
            )}
          </Card>
        );
      })}
    </div>
  );
}

function SettingsView({ categories, setCategories }) {
  const [newLabel, setNewLabel] = useState("");
  function updateLabel(id, label) {
    setCategories((list) => list.map((c) => (c.id === id ? { ...c, label } : c)));
  }
  function removeCategory(id) {
    setCategories((list) => list.filter((c) => c.id !== id));
  }
  return (
    <div className="max-w-lg mx-auto w-full">
      <SectionHeading title="プロフィール" />
      <Card className="p-4 mb-8 flex items-center gap-3">
        <span className="w-10 h-10 rounded-full flex items-center justify-center font-semibold" style={{ background: COLOR.brandBg, color: COLOR.brandDark }}>早</span>
        <div>
          <p className="text-sm font-medium">早稲田 太郎</p>
          <p className="text-xs" style={{ color: COLOR.sub }}>2年1組</p>
        </div>
      </Card>

      <SectionHeading title="カテゴリー管理" />
      <Card className="px-4 mb-3">
        {categories.map((c) => (
          <div key={c.id} className="flex items-center gap-2 py-2.5 border-b last:border-b-0" style={{ borderColor: COLOR.line }}>
            <input value={c.label} onChange={(e) => updateLabel(c.id, e.target.value)} className="flex-1 text-sm border rounded-lg px-2.5 py-1.5" style={{ borderColor: COLOR.line }} />
            <button onClick={() => removeCategory(c.id)} className="text-xs px-2 py-1 rounded-lg" style={{ color: COLOR.sub }}><Icon name="x" size={14} /></button>
          </div>
        ))}
      </Card>
      <div className="flex gap-2">
        <input value={newLabel} onChange={(e) => setNewLabel(e.target.value)} placeholder="新しいカテゴリー名" className="flex-1 text-sm border rounded-lg px-3 py-2" style={{ borderColor: COLOR.line }} />
        <button
          onClick={() => { if (newLabel.trim()) { setCategories((l) => [...l, { id: `cat-${Date.now()}`, label: newLabel.trim() }]); setNewLabel(""); } }}
          className="text-xs font-semibold px-4 rounded-lg text-white" style={{ background: COLOR.brand }}
        >
          追加
        </button>
      </div>
    </div>
  );
}
